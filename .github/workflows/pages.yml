name: GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: Install Zola
        run: |
          curl -L https://github.com/getzola/zola/releases/download/v0.19.2/zola-v0.19.2-x86_64-unknown-linux-gnu.tar.gz | tar xz
          sudo mv zola /usr/local/bin/
      
      - name: Configure base_url for GitHub Pages
        run: |
          # For GitHub Pages project pages, base_url should be "/repository-name/"
          # This ensures all links work correctly in GitHub Pages preview
          REPO_NAME="${{ github.event.repository.name }}"
          sed -i.bak "s#base_url = \".*\"#base_url = \"/${REPO_NAME}/\"#" config.toml && rm config.toml.bak
      
      - name: Build site
        run: zola build
      
      - name: Setup Pages
        uses: actions/configure-pages@v4
      
      - name: Upload pages artifact (for deployment)
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      
      - name: Upload preview artifact (for PRs)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: site-preview
          path: public
          retention-days: 1

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
  
  preview:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Comment PR with preview info
        uses: actions/github-script@v7
        with:
          script: |
            const comment = `## 🎨 Preview Build Complete
            
            The site has been built successfully for this PR.
            
            **To preview the site:**
            1. Go to the [Actions tab](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
            2. Download the \`site-preview\` artifact
            3. Extract the zip file
            4. Open \`index.html\` in your browser (or use \`python3 -m http.server\` in the extracted directory)
            
            **Available pages:**
            - Homepage (\`/\`)
            - About (\`/about/\`)
            - Philosophy (\`/philosophy/\`)
            - Team (\`/team-page/\`)
            - Blog (\`/posts/\`)
            - Projects (\`/projects/\`)
            - Testimonials (\`/testimonials/\`)
            
            The site will be automatically deployed to GitHub Pages when this PR is merged to \`main\`.
            `;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

