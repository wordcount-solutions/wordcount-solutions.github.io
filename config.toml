# Zola configuration
title = "WordCount Solutions, LLC"
description = "Human-Centered Technical Writing and Editing — On Demand"
base_url = "https://stage.wordcount.solutions"
theme = "vonge"
taxonomies = [
    { name = "tags", feed = true},
]

[markdown]
# Enable syntax highlighting
highlight_code = false
# Render tables
render = true
output_dir = "public"

[extra]
# Logo configuration
logo_image = "images/logo3.webp"

# Navigation configuration
# Set to false to hide sections from navigation
show_projects = false
show_blog = false
show_tags = false

navigation = [
    { url = "$BASE_URL", title = "Home" },
    { url = "$BASE_URL/contact", title = "Contact WordCount" },
    { url = "$BASE_URL/services", title = "Services" },
    { url = "$BASE_URL/services/faq", title = "FAQ" },
    { url = "$BASE_URL/team-page", title = "Team" },
    { url = "$BASE_URL/pricing", title = "Pricing" },
    { url = "", title = "More", submenu = [
        { url = "$BASE_URL/about", title = "About" },
        { url = "$BASE_URL/philosophy", title = "Philosophy" }
    ] }
]

# Social media icons in footer
social_icons = [
    { url = "https://github.com/wordcount-solutions", icon = "GitHub" },
    { url = "https://www.linkedin.com/company/wordcount-solutions/posts/?feedView=all", icon = "LinkedIn" }
]

[extra.newsletter]
newsletter_title = "Join our mailing list"
newsletter_description = "Get updates from the team."
newsletter_url = "https://40xak2.share-na2.hsforms.com/2mPzw7WXvReuWIZMS79wh1w"
newsletter_button = "Subscribe"

[extra.footer]
menu = [
    { url = "$BASE_URL", title = "Home" },
    { url = "$BASE_URL/contact", title = "Contact WordCount" },
    { url = "$BASE_URL/services", title = "Services" },
    { url = "$BASE_URL/services/faq", title = "FAQ" },
    { url = "$BASE_URL/team-page", title = "Team" },
    { url = "$BASE_URL/pricing", title = "Pricing" },
    { url = "$BASE_URL/philosophy", title = "Philosophy" },
    { url = "$BASE_URL/about", title = "About" }
]

